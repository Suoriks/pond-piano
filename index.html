<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071515">
  <meta name="description" content="Жестовый музыкальный пруд: касание рождает звук, движение меняет его высоту и глубину.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Пруд">
  <title>Пруд-пианино — этюд воды</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="pond.css">
</head>
<body>
  <main>
    <canvas id="pond" tabindex="0" role="application" aria-label="Музыкальный пруд. Коснитесь воды и ведите в стороны, чтобы менять высоту звука; вверх и вниз — его глубину. С клавиатуры удерживайте пробел, стрелками меняйте звук."></canvas>
    <div class="shore" aria-hidden="true"></div>
    <header class="title-block">
      <p class="eyebrow">Этюд воды · 06</p>
      <h1>Пруд-пианино</h1>
      <p class="hint">Коснись воды — и проведи звук</p>
    </header>
    <output id="status" class="sr-only" aria-live="polite">Пруд ждёт касания</output>
  </main>
  <script src="pond.js"></script>
</body>
</html>
