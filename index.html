<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071515">
  <meta name="description" content="Жестовый музыкальный пруд: касание рождает звук, движение меняет его высоту и глубину.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Пруд">
  <title>Пруд-пианино — этюд воды</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="pond.css">
</head>
<body>
  <main>
    <div class="gesture-surface" aria-hidden="true">
      <canvas id="pond" tabindex="0" role="application" aria-label="Музыкальный пруд. Коснитесь воды, чтобы мягко ударить чашу. Слева ниже, справа выше; глубина задаёт яркость и затухание. Ноты сразу попадают в пентатонический строй. Удержание и движение не меняют высоту чаши: она сама затихает, новое касание играет новую ноту. Можно играть шестью пальцами. С клавиатуры выбирайте место стрелками, ударяйте пробелом или Enter. У берега доступны строй, громкость, выключение звука и дневник фраз."></canvas>
    </div>
    <div class="shore" aria-hidden="true"></div>
    <header class="title-block">
      <p class="eyebrow">Этюд воды · 57</p>
      <h1>Пруд-пианино</h1>
      <p class="hint">Выдержка + нырок вниз — глубинный ответ</p>
      <p id="water-invitation" class="water-invitation" aria-hidden="true">Коснитесь воды</p>
    </header>
    <section class="tuning-control" aria-labelledby="tuning-label" aria-describedby="tuning-description">
      <p id="tuning-label" class="tuning-label">Течение · <output id="tuning-value">Рассвет</output></p>
      <div class="tuning-pebbles">
        <label class="tuning-choice">
          <input type="radio" name="tuning-family" value="dawn" checked>
          <span class="tuning-pebble pebble-dawn" aria-hidden="true"></span>
          <span class="sr-only">Рассвет — светлая открытая пентатоника</span>
        </label>
        <label class="tuning-choice">
          <input type="radio" name="tuning-family" value="dusk">
          <span class="tuning-pebble pebble-dusk" aria-hidden="true"></span>
          <span class="sr-only">Сумерки — тёплая минорная пентатоника</span>
        </label>
        <label class="tuning-choice">
          <input type="radio" name="tuning-family" value="mist">
          <span class="tuning-pebble pebble-mist" aria-hidden="true"></span>
          <span class="sr-only">Туман — подвешенная просторная пентатоника</span>
        </label>
      </div>
      <p id="tuning-description" class="sr-only">Стрелки выбирают семейство высот для следующего удара чаши. Уже звучащие ноты сохраняют высоту.</p>
    </section>
    <section id="diary-control" class="diary-control" aria-label="Дневник пруда">
      <button id="diary-stone" class="diary-stone" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="diary-panel">
        <span class="stone-line" aria-hidden="true"></span>
        <output id="diary-count" aria-hidden="true">0</output>
        <span class="sr-only">Дневник пруда: открыть список сохранённых фраз</span>
      </button>
      <div id="diary-panel" class="diary-panel" role="dialog" aria-modal="false" aria-label="Дневник воды">
        <p class="diary-heading">Дневник воды</p>
        <div id="diary-list" class="diary-list"></div>
        <p id="diary-empty" class="diary-empty">Пруд пока ничего не записал</p>
        <div id="diary-leaf" class="diary-leaf" hidden>
          <p id="leaf-text" class="leaf-text"></p>
          <button id="leaf-return" class="leaf-return" type="button">Вернуть на воду</button>
        </div>
        <button id="diary-return" class="diary-return" type="button">Вернуть фразу</button>
      </div>
    </section>
    <section class="shore-control" aria-label="Громкость пруда">
      <button id="volume-stone" class="volume-stone" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="volume-panel">
        <span class="stone-rings" aria-hidden="true"></span>
        <span class="sr-only">Настроить громкость пруда</span>
      </button>
      <div id="volume-panel" class="volume-panel" role="dialog" aria-modal="false" aria-label="Громкость воды">
        <div class="volume-heading">
          <label id="volume-label" for="master-volume">Громкость воды</label>
          <output id="volume-value" for="master-volume">72%</output>
        </div>
        <input id="master-volume" type="range" min="0" max="100" step="1" value="72">
        <button id="mute-water" class="mute-water" type="button">Приглушить</button>
      </div>
    </section>
    <output id="status" class="sr-only" aria-live="polite">Пруд ждёт касания</output>
  </main>
  <script src="pond-music.js"></script>
  <script src="pond-gesture.js"></script>
  <script src="pond-score.js"></script>
  <script src="pond-waves.js"></script>
  <script src="pond-chord.js"></script>
  <script src="pond-repose.js"></script>
  <script src="pond-caustic.js"></script>
  <script src="pond-tide.js"></script>
  <script src="pond-budget.js"></script>
  <script src="pond-master.js"></script>
  <script src="pond-a11y.js"></script>
  <script src="pond-audio-lifecycle.js"></script>
  <script src="pond.js"></script>
</body>
</html>
